<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модератор бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0B0B0B; color: white; font-family: system-ui; padding: 16px; }
        .card { background: #1E1E1E; border-radius: 24px; padding: 16px; margin-bottom: 16px; }
        button, select { background: #2C2C2E; border: none; padding: 8px 16px; border-radius: 30px; color: white; margin: 4px; }
        .switch { display: flex; justify-content: space-between; margin: 8px 0; }
    </style>
</head>
<body>
<div id="app">Загрузка...</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const userId = tg.initDataUnsafe?.user?.id || 123456789;
    const API_BASE = window.location.origin; // твой Render URL

    async function load() {
        const resp = await fetch(`${API_BASE}/api/my_groups?user_id=${userId}`);
        const data = await resp.json();
        if (!data.groups.length) {
            document.getElementById('app').innerHTML = '<div class="card">Нет групп. Добавьте бота в группу.</div>';
            return;
        }
        let html = '';
        for (const g of data.groups) {
            const s = g.settings;
            html += `<div class="card">
                <h3>${g.title} (${g.id})</h3>
                <div class="switch"><span>🤖 Авто-мод</span><input type="checkbox" class="toggle" data-chat="${g.id}" data-key="automod_enabled" ${s.automod_enabled ? 'checked' : ''}></div>
                <div class="switch"><span>🔗 Ссылки</span><input type="checkbox" class="toggle" data-chat="${g.id}" data-key="check_links" ${s.check_links ? 'checked' : ''}></div>
                <div class="switch"><span>📝 Слова</span><input type="checkbox" class="toggle" data-chat="${g.id}" data-key="check_keywords" ${s.check_keywords ? 'checked' : ''}></div>
                <div class="switch"><span>💧 Флуд</span><input type="checkbox" class="toggle" data-chat="${g.id}" data-key="check_flood" ${s.check_flood ? 'checked' : ''}></div>
                <div><label>Действие на ссылку</label><select class="select" data-chat="${g.id}" data-key="action_on_link">${['delete','warn','mute','ban'].map(v => `<option ${s.action_on_link===v?'selected':''}>${v}</option>`).join('')}</select></div>
                <div><label>Действие на слово</label><select class="select" data-chat="${g.id}" data-key="action_on_keyword">${['delete','warn','mute','ban'].map(v => `<option ${s.action_on_keyword===v?'selected':''}>${v}</option>`).join('')}</select></div>
                <div><label>Действие на флуд</label><select class="select" data-chat="${g.id}" data-key="action_on_flood">${['delete','warn','mute','ban'].map(v => `<option ${s.action_on_flood===v?'selected':''}>${v}</option>`).join('')}</select></div>
                <div><label>Порог флуда</label><input type="number" class="number" data-chat="${g.id}" data-key="flood_threshold" value="${s.flood_threshold}"></div>
                <div><label>Мут (мин)</label><input type="number" class="number" data-chat="${g.id}" data-key="mute_duration" value="${s.mute_duration}"></div>
                <div><label>Лимит предупреждений</label><input type="number" class="number" data-chat="${g.id}" data-key="warn_limit" value="${s.warn_limit}"></div>
                <hr><b>Запрещённые слова:</b> ${g.words.map(w => `<span style="background:#2C2C2E;padding:4px 8px;border-radius:20px;">${w}</span>`).join(' ')}<br>
                <input id="newWord_${g.id}" placeholder="Новое слово"><button onclick="addWord(${g.id})">➕</button>
            </div>`;
        }
        document.getElementById('app').innerHTML = html;
        document.querySelectorAll('.toggle').forEach(el => el.onchange = (e) => saveSetting(el.dataset.chat, el.dataset.key, el.checked));
        document.querySelectorAll('.select').forEach(el => el.onchange = (e) => saveSetting(el.dataset.chat, el.dataset.key, el.value));
        document.querySelectorAll('.number').forEach(el => el.onchange = (e) => saveSetting(el.dataset.chat, el.dataset.key, parseInt(el.value)));
    }
    async function saveSetting(chatId, key, val) {
        await fetch(`${API_BASE}/api/settings`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: parseInt(chatId), action: 'set_setting', key, value: val }) });
    }
    window.addWord = async (chatId) => {
        const word = document.getElementById(`newWord_${chatId}`).value.trim();
        if(!word) return;
        await fetch(`${API_BASE}/api/settings`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: chatId, action: 'add_word', word }) });
        load();
    };
    load();
</script>
</body>
</html>
